# Provider defaults. Override any of these per project in brief.yaml (same keys).
# API keys are read from environment variables, never from these files.

llm:
  provider: claude            # claude | manual  (manual = write the prompt to a file, paste the answer back)
  model: claude-opus-5-5
  effort: high                # low | medium | high | xhigh | max
  max_tokens: 64000

tts:
  provider: kokoro            # kokoro (local, free) | elevenlabs | openai | edge | silent
  trim_db: -45                # trim leading/trailing silence of every clip before timing
  kokoro:
    voice: am_michael         # male storyteller voices: am_michael, am_fenrir, am_puck, bm_george, bm_lewis
    speed: 1.12
    lang: en-us
    model_dir: models/kokoro  # filled by `python -m chronicle setup --kokoro`
  elevenlabs:                 # env: ELEVENLABS_API_KEY
    voice_id: ""              # pick a deep, energetic "documentary storyteller" voice in your library
    model_id: eleven_multilingual_v2
    stability: 0.40
    similarity_boost: 0.75
    style: 0.35
    use_speaker_boost: true
    speed: 1.08
  openai:                     # env: OPENAI_API_KEY
    model: gpt-4o-mini-tts
    voice: onyx
    instructions: >-
      Energetic, confident documentary storyteller. Fast but crisp delivery, about 190 words per minute.
      Punch the first word after a pause, land numbers and names clearly, smile slightly on ironic lines,
      drop the pitch on dark turns. No breathy pauses.
  edge:                       # free Microsoft voices via the edge-tts package (needs websocket access)
    voice: en-US-ChristopherNeural
    rate: "+12%"

images:
  provider: placeholder       # placeholder (offline animatic) | openai | gemini | replicate | folder
  openai:                     # env: OPENAI_API_KEY
    model: gpt-image-1
    quality: medium
  gemini:                     # env: GEMINI_API_KEY
    model: gemini-2.5-flash-image
  replicate:                  # env: REPLICATE_API_TOKEN
    model: black-forest-labs/flux-1.1-pro
  folder:
    dir: images_in            # drop files named beat_001.png ... (e.g. from Midjourney) here

align:
  method: whisper             # whisper (faster-whisper) | proportional
  whisper_model: base.en
