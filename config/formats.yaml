# Format presets. A project is planned for one primary format and can be rendered to any of them.
# Numbers marked (ref) are measured from the reference video (docs/00-teardown-report.md).
# Any key can be overridden per project in brief.yaml under `format_overrides:`.

presets:

  # ---------------------------------------------------------------- long-form, faithful to the reference
  long_16x9:
    label: "YouTube long-form 8-15 min, 16:9 (faithful clone of the reference edit)"
    width: 1920
    height: 1080
    fps: 30
    duration_s: 720            # 12 min
    wpm: 190                   # (ref) 193
    hook_share: 0.05           # (ref) 35 s of 733 s
    shot: {target_s: 3.6, min_s: 1.2, max_s: 6.0}   # (ref) median 3.58, p10 2.30, p90 5.07, max 6.5
    split_words: 17            # (ref) p90 words per shot = 17 -> split longer sentences at a clause
    picture_lead_s: 0.19       # (ref) next word starts 0.19 s after the cut
    pauses_s: {sentence: 0.28, clause: 0.14, chapter: 0.45}   # (ref) median pause 0.25, p90 0.43
    tail_s: 0.8
    motion: static             # (ref) every shot is a still. Options: static | subtle | dynamic
    punch_cuts: false          # split very long shots into two framings of the same image
    layout: auto               # auto = fill when the image aspect matches, centred card otherwise | fill | card
    transitions: {default: cut, chapter: flash}      # (ref) hard cuts, one flash at a chapter break
    overlays: true             # engine-drawn name/number/date cards (set false if text is baked into images)
    captions: {enabled: false}
    header: {enabled: false}
    progress_bar: false
    music: {enabled: false, gain_db: -24, duck_db: 10}
    sfx: {enabled: false, whoosh_db: -16, pop_db: -20}
    loudness: {lufs: -14.0, true_peak_db: -1.0}        # (ref) was -17.7 LUFS, this is a deliberate upgrade
    chapters: {min_count: 6, max_count: 10}
    image_aspect: "16:9"

  long_16x9_enhanced:
    extends: long_16x9
    label: "YouTube long-form, 16:9, with subtle motion, SFX and a music bed (A/B test against long_16x9)"
    motion: subtle
    music: {enabled: true, gain_db: -26, duck_db: 10}
    sfx: {enabled: true, whoosh_db: -18, pop_db: -22}

  mid_16x9:
    extends: long_16x9_enhanced
    label: "3-6 min explainer, 16:9"
    duration_s: 240
    wpm: 195
    hook_share: 0.07
    shot: {target_s: 3.2, min_s: 1.1, max_s: 5.0}
    split_words: 15
    chapters: {min_count: 3, max_count: 6}

  deep_16x9:
    extends: long_16x9
    label: "20-40 min deep dive, 16:9"
    duration_s: 1800
    wpm: 180
    hook_share: 0.035
    shot: {target_s: 4.0, min_s: 1.2, max_s: 6.5}
    motion: subtle
    chapters: {min_count: 10, max_count: 20}

  # ---------------------------------------------------------------- vertical / short-form
  short_9x16:
    label: "Shorts / Reels / TikTok, 9:16, 30-60 s"
    width: 1080
    height: 1920
    fps: 30
    duration_s: 58
    wpm: 200
    hook_share: 0.05
    shot: {target_s: 2.4, min_s: 0.9, max_s: 3.4}
    split_words: 10
    picture_lead_s: 0.12
    pauses_s: {sentence: 0.18, clause: 0.08, chapter: 0.25}
    tail_s: 0.5
    motion: dynamic
    punch_cuts: true
    layout: auto               # 9:16 images fill the frame; 16:9 images become a centred card over a blurred copy
    card: {aspect: 1.2, y: 0.44}   # wide images are framed as a 6:5 window around the beat's focus point
    transitions: {default: cut, chapter: flash}
    overlays: true
    captions: {enabled: true, style: pop, max_words: 3, max_chars: 18, y: 0.75, uppercase: true}
    header: {enabled: true, until_s: 3.2, persist: true}
    progress_bar: true
    music: {enabled: true, gain_db: -24, duck_db: 9}
    sfx: {enabled: true, whoosh_db: -16, pop_db: -20}
    loudness: {lufs: -14.0, true_peak_db: -1.0}
    chapters: {min_count: 3, max_count: 5}
    image_aspect: "9:16"

  short_9x16_from_16x9:
    extends: short_9x16
    label: "9:16 render of a project whose images are 16:9 (card layout)"
    layout: card
    image_aspect: "16:9"

  square_1x1:
    extends: short_9x16
    label: "Feed post, 1:1"
    width: 1080
    height: 1080
    card: {aspect: 1.5, y: 0.44}
    captions: {enabled: true, style: pop, max_words: 3, max_chars: 18, y: 0.87, uppercase: true}
    image_aspect: "1:1"

  portrait_4x5:
    extends: short_9x16
    label: "Instagram / Facebook feed, 4:5"
    width: 1080
    height: 1350
    card: {aspect: 1.3, y: 0.43}
    captions: {enabled: true, style: pop, max_words: 3, max_chars: 18, y: 0.84, uppercase: true}
    image_aspect: "4:5"

  # ---------------------------------------------------------------- utility
  preview_16x9:
    extends: long_16x9
    label: "Fast low-res proof render"
    width: 960
    height: 540
    fps: 24
