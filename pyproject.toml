[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronicle-explainers"
version = "1.0.0"
description = "Reusable pipeline for illustrated, narrated 'ENTIRE history of X' explainer videos in any length and aspect ratio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pillow>=10",
  "opencv-python-headless>=4.8",
  "pyyaml>=6",
  "soundfile>=0.12",
  "soxr>=0.3",
  "scipy>=1.10",
  "pyloudnorm>=0.1",
  "requests>=2.31",
]

[project.optional-dependencies]
claude = ["anthropic>=1.15"]                       # LLM writing stages
kokoro = ["kokoro-onnx>=0.4", "onnxruntime>=1.17"]  # free local voice
align = ["faster-whisper>=1.0"]                     # word timings for captions / subtitles
edge = ["edge-tts>=6.1"]                            # free online Microsoft voices
analyze = ["scenedetect[opencv-headless]>=0.6", "librosa>=0.10", "faster-whisper>=1.0", "matplotlib>=3.7"]
dev = ["pytest>=8"]
all = ["chronicle-explainers[claude,kokoro,align,analyze,dev]"]

[project.scripts]
chronicle = "chronicle.cli:main"

[tool.setuptools]
packages = ["chronicle", "chronicle.render"]

[tool.pytest.ini_options]
testpaths = ["tests"]
